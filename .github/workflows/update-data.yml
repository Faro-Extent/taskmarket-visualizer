name: update-data

# Hourly server-side data refresh.
# Fetches the Taskmarket API and commits fresh data/*.json. The commit itself
# triggers the standard GitHub Pages branch deploy, so this workflow does NOT
# deploy Pages itself (deploying from both places at once collided and failed).
on:
  push:
    branches: [main]
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Fetch fresh market data (server-side)
        run: node scripts/fetch-data.mjs
      - name: Commit refreshed data
        run: |
          git config user.name "taskmarket-visualizer-bot"
          git config user.email "bot@taskmarket-visualizer.local"
          git add data/
          git diff --cached --quiet || git commit -m "data: refresh $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push || true
